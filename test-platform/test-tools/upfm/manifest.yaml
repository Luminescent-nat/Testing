      test_package:
        type: string
        default: com.example.testapp
        description: 测试 APK 包名
      expect:
        type: string
        default: ok
        description: ok=预期安装成功；blocked=白名单机型预期安装被拒
  judgement_type: assertion
  result_parse:
    pass_pattern: 'RESULT: PASS'
    fail_pattern: 'RESULT: FAIL'
  timeout: 120
  retry_count: 0
  on_failure: continue
  sort_order: 18
  enabled: true
  tags:
  - functional
