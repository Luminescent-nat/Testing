      min_percent:
        type: string
        default: '50'
        description: 剩余内存百分比下限（用例 60-70，按首启基线校准）
      max_percent:
        type: string
        default: '80'
        description: 剩余内存百分比上限
  judgement_type: assertion
  result_parse:
