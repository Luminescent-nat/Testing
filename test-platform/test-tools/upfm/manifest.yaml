  judgement_type: assertion
  result_parse:
    pass_pattern: 'RESULT: PASS'
    fail_pattern: 'RESULT: FAIL'
  timeout: 120
  retry_count: 0
  on_failure: continue
  sort_order: 19
  enabled: true
  tags:
  - functional
- name: T1-17 TF卡识别
  description: 用例 5.1.1：host_exec 自动发现 TF 卡挂载点（sm list-volumes / /mnt/media_rw）
  objective: 验证 TF 卡被系统识别并挂载
