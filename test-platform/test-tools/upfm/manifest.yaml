# test-tools 模块清单：由后端 POST /api/v1/tools/scan-modules 扫描注册到平台数据库。
# 字段名对齐 TestItem 模型列；host_exec 命令使用 {host_tool_dir} 占位（执行引擎自动解析为
# 配置项 TEST_TOOLS_PATH 的绝对路径），{serial} 为设备序列号占位。
module:
  name: UPFM
  category: system
  description: UPFM T1 自动化测试
items:
- name: T1-01 网络连通性（ping）
  description: 覆盖用例 2.1.2/2.2.5/2.3.5：ping 外网断言 0% 丢包（设备无 curl/wget，网络层验证以 ping 为准）
  objective: 验证设备网络连通性（移动网络/以太网/WiFi 任一可用链路）
  precondition: 设备已联网（任一网卡）
  steps: ping -c 4 -W 2 www.baidu.com
  expected_result: 4 包发出 4 包收到，0% packet loss
  exec_type: adb_shell
  exec_command: ping -c 4 -W 2 www.baidu.com
  judgement_type: assertion
  result_parse:
    pass_pattern: 0% packet loss
    fail_pattern: unknown host|100% packet loss
  timeout: 30
  retry_count: 2
  on_failure: continue
  sort_order: 1
  enabled: true
  tags:
  - functional
- name: T1-02 以太网 MAC 地址
  description: 用例 2.2.3 读取部分：读取 eth0 MAC 并断言格式合法（跨设备唯一性/重启稳定性归 T2/T3）
  objective: 验证以太网 MAC 地址可读取且格式正确
  precondition: 设备具备 eth0 网卡
  steps: cat /sys/class/net/eth0/address
  expected_result: 输出合法 MAC（如 66:40:65:b8:0c:e7）
  exec_type: adb_shell
  exec_command: cat /sys/class/net/eth0/address
  judgement_type: assertion
  result_parse:
    pass_pattern: ([0-9a-f]{2}:){5}[0-9a-f]{2}
  timeout: 30
  retry_count: 2
  on_failure: continue
  sort_order: 2
  enabled: true
  tags:
  - functional
- name: T1-06 以太网链路状态
  description: 用例 2.2.1 开关动作 + 2.2.7 命令层：读 eth0 carrier 断言链路已连接
  objective: 验证以太网链路处于连接状态
  precondition: 【人工前置】插入网线；未插网线时本项预期失败（平台无跳过语义，按失败记录并复测）
  steps: cat /sys/class/net/eth0/carrier && ip link show eth0
  expected_result: carrier=1（链路已连接）
  exec_type: adb_shell
  exec_command: cat /sys/class/net/eth0/carrier && ip link show eth0
  judgement_type: assertion
  result_parse:
    pass_pattern: "(?m)^1\r?$"
    fail_pattern: "(?m)^0\r?$"
  timeout: 30
  retry_count: 2
  on_failure: continue
  sort_order: 3
  enabled: true
  tags:
  - functional
- name: T1-07 固件版本与分支
  description: 用例 3.1.1/3.1.2/3.1.5：固件版本属性三行均非空。注：本固件无 ro.mc.custom.version，按实机适配为 ro.mc.custom_api_version；精确版本比对由 T1-08
    参数化覆盖
  objective: 验证固件版本/分支/定制版本属性存在且非空
  precondition: 无
  steps: echo "display_id=$(getprop ro.build.display.id)" && echo "mc_version=$(getprop ro.mc.version)" && echo "custom_api_version=$(getprop
    ro.mc.custom_api_version)"
  expected_result: display_id / mc_version 非空，custom_api_version 字段存在（A133P 固件为空串，允许）
  exec_type: adb_shell
  exec_command: echo "display_id=$(getprop ro.build.display.id)" && echo "mc_version=$(getprop ro.mc.version)" && echo "custom_api_version=$(getprop
    ro.mc.custom_api_version)"
  judgement_type: assertion
  result_parse:
    pass_pattern: display_id=\S[\s\S]*mc_version=\S[\s\S]*custom_api_version=
  timeout: 30
  retry_count: 0
  on_failure: continue
  sort_order: 4
  enabled: true
  tags:
  - functional
- name: T1-08 系统配置 ro.mc.* 七字段
  description: 用例 3.1.3：host_exec 逐字段比对 ro.mc.* 七字段，全部一致才 PASS。期望值参数化，与 Jira 的一致性 = 人工把期望值填参。注：文档字段 expected_custom_version
    映射 ro.mc.custom_api_version（固件无 ro.mc.custom.version）；ro.mc.oem.version 本固件为空串
  objective: 验证系统配置 ro.mc.* 七字段与基线一致
  precondition: 无
  steps: host_exec mc_props_check.py 逐字段读取比对，输出比对表
  expected_result: 七字段全部与期望值一致
  exec_type: host_exec
  exec_command: python "{host_tool_dir}/upfm/host/mc_props_check.py" --serial {serial} --expected-android-version "{expected_android_version}"
    --expected-cpu "{expected_cpu}" --expected-custom-version "{expected_custom_version}" --expected-oem-img-version "{expected_oem_img_version}"
    --expected-product "{expected_product}" --expected-version "{expected_version}" --expected-version-code "{expected_version_code}"
  parameters:
    expected_android_version: ''
    expected_cpu: ''
    expected_custom_version: ''
    expected_oem_img_version: ''
    expected_product: ''
    expected_version: ''
    expected_version_code: ''
  parameters_schema:
    type: object
    properties:
      expected_android_version:
        type: string
        default: ''
        description: ro.mc.android_version 期望值；空 = 按板型画像自动取值，* = 只读不比对
      expected_cpu:
        type: string
        default: ''
        description: ro.mc.cpu 期望值；空 = 按板型画像自动取值，* = 只读不比对
      expected_custom_version:
        type: string
        default: ''
        description: ro.mc.custom_api_version 期望值；空 = 按板型画像自动取值，* = 只读不比对
      expected_oem_img_version:
        type: string
        default: ''
        description: ro.mc.oem.version 期望值；空 = 按板型画像自动取值，* = 只读不比对
      expected_product:
        type: string
        default: ''
        description: ro.mc.product 期望值；空 = 按板型画像自动取值，* = 只读不比对
      expected_version:
        type: string
        default: ''
        description: ro.mc.version 期望值；空 = 按板型画像自动取值，* = 只读不比对
      expected_version_code:
        type: string
        default: ''
        description: ro.mc.version_code 期望值；空 = 按板型画像自动取值，* = 只读不比对
  judgement_type: assertion
  result_parse:
    pass_pattern: 'RESULT: PASS'
    fail_pattern: 'RESULT: FAIL'
  timeout: 60
  retry_count: 0
  on_failure: continue
  sort_order: 5
  enabled: true
  tags:
  - functional
- name: T1-09 默认时区与自动校时
  description: 用例 3.2.1 默认状态部分：时区 Asia/Shanghai 且 auto_time=1
  objective: 验证默认时区与自动校时开关
  precondition: 无
  steps: getprop persist.sys.timezone && settings get global auto_time
  expected_result: Asia/Shanghai + 1
  exec_type: adb_shell
  exec_command: getprop persist.sys.timezone && settings get global auto_time
  judgement_type: assertion
  result_parse:
    pass_pattern: "Asia/Shanghai\r?\n1"
    fail_pattern: "(?m)(^|\\n)0\r?$"
  timeout: 30
  retry_count: 0
  on_failure: continue
  sort_order: 6
  enabled: true
  tags:
  - functional
- name: T1-10 默认 Launcher
  description: 用例 4.4.1：断言默认桌面为系统 Launcher（实机 com.android.launcher3，定制机型改判定参数）
  objective: 验证默认 Launcher 已设置
  precondition: 无
  steps: cmd shortcut get-default-launcher
  expected_result: '输出 Launcher: ComponentInfo{...}'
  exec_type: adb_shell
  exec_command: cmd shortcut get-default-launcher
  judgement_type: assertion
  result_parse:
    pass_pattern: 'Launcher: ComponentInfo'
  timeout: 30
  retry_count: 0
  on_failure: continue
  sort_order: 7
  enabled: true
  tags:
  - functional
- name: T1-13 屏幕旋转设置
  description: 用例 4.2.1 设置读回部分：记录原值 -> 设 user_rotation=1 读回 -> 恢复原值
  objective: 验证屏幕旋转设置可写入并读回
  precondition: 无
  steps: host_exec rotation_check.py 锁定自动旋转 -> 写入与原值不同的 user_rotation -> 读回断言 -> 恢复原值
  expected_result: 读回值等于写入值，结束后恢复原值（A10 上 user_rotation 为 null 的场景由 runner 处理）
  exec_type: host_exec
  exec_command: python "{host_tool_dir}/upfm/host/rotation_check.py" --serial {serial}
  judgement_type: assertion
  result_parse:
    pass_pattern: 'RESULT: PASS'
    fail_pattern: 'RESULT: FAIL'
  timeout: 60
  retry_count: 0
  on_failure: continue
  sort_order: 8
  enabled: true
  tags:
  - functional
- name: T1-14 亮度设置
  description: 用例 4.2.2 设置读回部分：30/200 两档写入读回后恢复原值（实际观感归 T3 图像）
  objective: 验证屏幕亮度设置可写入并读回
  precondition: 无
  steps: 记录原值 -> 设 30 读回 -> 设 200 读回 -> 恢复原值
  expected_result: 两次读回分别为 30、200，结束后恢复原值
  exec_type: adb_shell
  exec_command: orig=$(settings get system screen_brightness) && settings put system screen_brightness 30 && b1=$(settings
    get system screen_brightness) && settings put system screen_brightness 200 && b2=$(settings get system screen_brightness)
    && settings put system screen_brightness $orig && echo "orig=$orig low=$b1 high=$b2 restored=$(settings get system screen_brightness)"
  judgement_type: assertion
  result_parse:
    pass_pattern: low=30 high=200
  timeout: 30
  retry_count: 0
  on_failure: continue
  sort_order: 9
  enabled: true
  tags:
  - functional
- name: T1-15 休眠时间
  description: 用例 4.2.3：host_exec 记录原 timeout -> 设 15000ms -> 等待 20s -> dumpsys power 断言 mWakefulness=Asleep -> 唤醒并恢复原值（finally
    保证恢复）
  objective: 验证设备按设定时间进入休眠
  precondition: 无人工唤醒源干扰；stay_on_while_plugged_in 应为 0
  steps: 设 screen_off_timeout=15000 -> 等待 -> 断言 Asleep -> KEYCODE_WAKEUP -> 恢复原值
  expected_result: 等待后 mWakefulness=Asleep，唤醒后 Awake，timeout 恢复原值
  exec_type: host_exec
  exec_command: python "{host_tool_dir}/upfm/host/sleep_check.py" --serial {serial} --timeout-ms {timeout_ms} --wait-seconds
    {wait_seconds}
  parameters:
    timeout_ms: '15000'
    wait_seconds: '20'
  parameters_schema:
    type: object
    properties:
      timeout_ms:
        type: string
        default: '15000'
        description: 测试用 screen_off_timeout（毫秒）
      wait_seconds:
        type: string
        default: '20'
        description: 等待休眠秒数（需大于 timeout_ms）
  judgement_type: assertion
  result_parse:
    pass_pattern: 'RESULT: PASS'
    fail_pattern: 'RESULT: FAIL'
  timeout: 90
  retry_count: 1
  on_failure: continue
  sort_order: 10
  enabled: true
  tags:
  - functional
- name: T1-16 触摸点数
  description: 用例 4.3.1：host_exec 解析 getevent -pl，取 ABS_MT_SLOT（无则 TRACKING_ID）max+1
  objective: 验证触摸点数达到规格
  precondition: 无
  steps: 解析 getevent -pl 触摸设备 ABS_MT 最大值
  expected_result: 实测点数等于板型画像期望点数
  exec_type: host_exec
  exec_command: python "{host_tool_dir}/upfm/host/touch_points.py" --serial {serial} --expected-points "{expected_points}"
  parameters:
    expected_points: ''
  parameters_schema:
    type: object
    properties:
      expected_points:
        type: string
        default: ''
        description: 期望触摸点数；空 = 按板型画像自动取值
  judgement_type: assertion
  result_parse:
    pass_pattern: 'RESULT: PASS'
    fail_pattern: 'RESULT: FAIL'
  timeout: 60
  retry_count: 0
  on_failure: continue
  sort_order: 11
  enabled: true
  tags:
  - functional
- name: T1-22 CPU 支持频率
