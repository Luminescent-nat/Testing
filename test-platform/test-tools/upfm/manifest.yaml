- name: T1-11 APK 安装
  description: '用例 3.5.1：host_exec 安装测试 APK 并断言包名出现。测试 APK 缺失时 runner 输出 RESULT: SKIP 标记（平台无跳过语义，记录显示为 error，放入 test-tools/upfm/assets/test_app.apk
