  objective: 验证首次重启后剩余内存比例落在规格区间
  precondition: 【前置】烧录固件重启后优先执行；非首启状态比例偏低属预期
  steps: dumpsys meminfo 解析 Total/Free RAM，计算百分比并做区间断言
  expected_result: 剩余内存比例落在 [min_percent, max_percent]
