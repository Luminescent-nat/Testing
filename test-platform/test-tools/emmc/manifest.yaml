  tags:
  - stability
  - curve
- name: 随机写稳定性（BW/IOPS 曲线）
  description: fio stability --rw=randwrite --bs=4k --runtime=300 --rounds=1，生成 BW/IOPS 曲线图，人工判定
  exec_type: host_exec
  exec_command: python "{host_tool_dir}/emmc/host/emmc_stability_runner.py" --serial {serial} --mode rand_write --runtime
