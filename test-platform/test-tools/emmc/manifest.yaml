- name: 顺序读稳定性（BW/IOPS 曲线）
  description: fio stability --rw=read --bs=128k --runtime=300 --rounds=1，生成 BW/IOPS 曲线图，人工判定
  exec_type: host_exec
  exec_command: python "{host_tool_dir}/emmc/host/emmc_stability_runner.py" --serial {serial} --mode seq_read --runtime 300
    --rounds 1
  parameters: {}
  judgement_type: assertion
  result_parse:
