# Docker Compose v2（使用 `docker compose` 命令，无需 version 字段）
# 用法：
#   docker compose up -d --build      # 构建并启动
#   docker compose logs -f app        # 查看日志
#   docker compose down               # 停止
#
# 首次部署若需迁移现有数据（详见 DEPLOYMENT.md）：
#   mkdir -p data/storage
#   cp backend/test_platform.db data/
#   cp -r backend/storage/* data/storage/

services:
  app:
    build: .
    # 契约 v1.1 task-D：显式 image 名与 backend/scripts/check_image_tools.py 的
    # docker build --tag 一致（v1.0 缺失时 compose 会用项目名自行命名镜像，
    # 导致 docker build 与 compose up 验证的不是同一个镜像）。
    image: test-platform:v1-08-check
    container_name: test-platform
    ports:
      - "8000:8000"
    volumes:
      # SQLite 数据库 + 上传文件/报告/测试日志，持久化到宿主机 ./data
      # 容器内路径由 Dockerfile 中的 DATABASE_URL / STORAGE_PATH 等环境变量固定为 /data
      - ./data:/data
    environment:
      # T-18：SECRET_KEY 必须显式提供（${SECRET_KEY:?...} 在未设置时直接报错，
      # 不再提供 any 弱默认占位）。写入 .env（compose 自动读取）或导出环境变量。
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY 未设置：请在 .env 或环境变量中显式提供至少 32 字符的随机密钥（python -c "import secrets; print(secrets.token_urlsafe(48))"），占位值/弱密钥会被应用启动校验拒绝}
      # 前端产物在镜像 /app/static，挂载到 / 提供浏览器访问
      - STATIC_PATH=/app/static
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # 若被测 Android 设备通过 USB 直挂服务器（非常规做法，推荐网络 adb），取消下行注释：
    # privileged: true   # 并确认宿主机 /dev/bus/usb 可被容器访问
