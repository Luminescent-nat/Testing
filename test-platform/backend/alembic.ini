# Alembic configuration: database schema migrations.
#
# sqlalchemy.url is NOT hardcoded here: env.py reads it from the DATABASE_URL
# environment variable (falling back to the app default in app/config.py) and
# rewrites the async driver (+aiosqlite) to the sync sqlite driver.
#
# NOTE: keep this file ASCII-only. Python's configparser reads .ini files with
# the OS locale encoding (GBK on zh-CN Windows), so non-ASCII comments break it.
#
# Common commands (run inside backend/):
#   alembic upgrade head     # upgrade an existing database to the latest schema
#   alembic stamp head       # mark a fresh create_all database as up-to-date
#   alembic revision --autogenerate -m "..."  # generate a migration from models

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The real URL is derived by env.py from the DATABASE_URL env var; placeholder only
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
